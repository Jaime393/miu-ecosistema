name: miu-savia-bridge
# Restaura el puente roto: sincroniza phi y savia desde metabolismo hacia relay_config
# Corre cada 3h junto al State Writer
on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      PANT: https://tpfiybpguuxskitszhmk.supabase.co
      PANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
    steps:
      - name: Leer estado_miu vivo desde panteon
        run: |
          # estado_miu es la tabla viva — lee phi y savia reales
          ESTADO=$(curl -sf "$PANT/rest/v1/estado_miu?select=phi,savia,ciclo,rho,ts&limit=1&order=ts.desc" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" 2>/dev/null)
          echo "estado_miu: $ESTADO"
          
          PHI=$(echo $ESTADO | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('phi','') if d else '')" 2>/dev/null)
          SAVIA=$(echo $ESTADO | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('savia','') if d else '')" 2>/dev/null)
          CICLO=$(echo $ESTADO | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('ciclo','') if d else '')" 2>/dev/null)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          echo "PHI=$PHI SAVIA=$SAVIA CICLO=$CICLO"
          
          if [ -z "$PHI" ] && [ -z "$SAVIA" ]; then
            echo "estado_miu no accesible desde anon — intentando relay_config vivo"
            # Leer del metabolismo via relay si existe
            SAVIA_RC=$(curl -sf "$PANT/rest/v1/relay_config?clave=eq.savia_global&select=valor" \
              -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['valor'] if d else '')" 2>/dev/null)
            echo "relay_config.savia_global: $SAVIA_RC"
          fi
          
          # Escribir bridge timestamp a gossip (evidencia de intento)
          curl -sf -X POST "$PANT/rest/v1/gossip_log" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d "[{\"tipo\":\"savia_bridge\",\"origen\":\"github-action\",\"contenido\":\"phi=${PHI:-FOSIL} savia=${SAVIA:-FOSIL} ciclo=${CICLO:-?} ts=$TS\",\"ts\":\"$TS\"}]"
          
          # Si tenemos valores reales, actualizar relay_config
          if [ -n "$PHI" ] && [ "$PHI" != "40296" ]; then
            echo "PHI vivo encontrado: $PHI — actualizando relay_config"
            curl -sf -X POST "$PANT/rest/v1/relay_config?on_conflict=clave" \
              -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: resolution=merge-duplicates,return=minimal' \
              -d "[{\"clave\":\"phi_vivo_bridge\",\"valor\":\"$PHI\"},{\"clave\":\"savia_vivo_bridge\",\"valor\":\"$SAVIA\"},{\"clave\":\"ciclo_vivo_bridge\",\"valor\":\"$CICLO\"}]"
          else
            echo "phi=$PHI — posible fósil o inaccesible desde anon. Diagnóstico registrado en gossip."
          fi
