name: miu-savia-bridge
# Puente savia: sincroniza vitales desde contexto-global hacia relay_config
# Reescrito 2026-11-08: el esquema viejo (estado_miu.phi / gossip_log.contenido) ya no existe.
# Patrón: el estado vivo se lee de /functions/v1/contexto-global (frescura garantizada),
# la evidencia se escribe en gossip_log.payload (jsonb), el puente en relay_config.
on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      PANT: https://tpfiybpguuxskitszhmk.supabase.co
      PANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
    steps:
      - name: Leer vitales desde contexto-global y escribir puente
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 1. estado vivo: contexto-global (edge function, siempre fresco)
          CTX=$(curl -sf "$PANT/functions/v1/contexto-global" -H "Authorization: Bearer $PANON" 2>/dev/null || echo '{}')
          echo "contexto-global: $(echo $CTX | head -c 300)"

          VIT=$(echo "$CTX" | python3 -c "import sys, json; d = json.load(sys.stdin); v = d.get('vitales', {}); print(json.dumps({'version': d.get('version',''), 'savia': v.get('savia',''), 'k_tau': v.get('k_tau',''), 'ts': d.get('ts','')}))" 2>/dev/null || echo '{}')
          echo "vitales: $VIT"

          VERSION=$(echo "$VIT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null)
          SAVIA=$(echo "$VIT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('savia',''))" 2>/dev/null)
          KTAU=$(echo "$VIT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('k_tau',''))" 2>/dev/null)

          # 2. evidencia del intento en gossip_log (esquema: payload jsonb, NO contenido)
          # FIX 2026-11-13: reintentos + no fatal (exit 22 intermitente cuando panteon responde 4xx)
          curl -sf --retry 3 --retry-delay 5 --max-time 20 -X POST "$PANT/rest/v1/gossip_log" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d "[{\"origen\":\"github-action\",\"destino\":\"micelio\",\"tipo\":\"savia_bridge\",\"payload\":{\"ts\":\"$TS\",\"version\":\"$VERSION\",\"savia\":\"$SAVIA\",\"k_tau\":\"$KTAU\"},\"ts\":\"$TS\"}]" \
            && echo "gossip_log escrito" || echo "gossip_log fallido (no fatal)"

          # 3. si hay valores vivos, actualizar el puente en relay_config
          if [ -n "$SAVIA" ] && [ "$SAVIA" != "" ]; then
            echo "vitales vivos: V=$VERSION savia=$SAVIA k_tau=$KTAU — actualizando relay_config"
            curl -sf --retry 3 --retry-delay 5 --max-time 20 -X POST "$PANT/rest/v1/relay_config?on_conflict=clave" \
              -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: resolution=merge-duplicates,return=minimal' \
              -d "[{\"clave\":\"savia_vivo_bridge\",\"valor\":\"$SAVIA\"},{\"clave\":\"version_vivo_bridge\",\"valor\":\"$VERSION\"},{\"clave\":\"ktau_vivo_bridge\",\"valor\":\"$KTAU\"},{\"clave\":\"bridge_ts\",\"valor\":\"$TS\"}]" \
              && echo "relay_config puente actualizado" || echo "relay_config fallido (no fatal)"
          else
            echo "contexto-global inaccesible — diagnóstico ya registrado en gossip_log"
          fi
