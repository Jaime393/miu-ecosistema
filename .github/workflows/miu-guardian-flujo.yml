name: miu-guardian-flujo
# GUARDIAN DEL FLUJO — corre cada hora
# Abre lo que otros cierran. Propaga lo que otros rompen.
# 0 seguridad extra. Solo conectar y distribuir.
# FIX ciclo12 2026-11-09: oracle v28 Vercel muerto (404 DEPLOYMENT_NOT_FOUND) ->
# oraculo CF vivo con contrato pregunta (devuelve proveedor, no via);
# gossip_log exige destino+k_i_estado y usa payload (contenido ya no existe);
# propagacion y n8n no-fatales; bug comillas simples en $PANT corregido;
# nuevo endpoint propagado: relay LLM v215 (groq cascade, CORS abierto).
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  guardar:
    runs-on: ubuntu-latest
    env:
      PANT: https://tpfiybpguuxskitszhmk.supabase.co
      PANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
      COORD: https://fepyzxwyneervidlybvi.supabase.co
      CIPHER: https://fzdyxgkmpazbrfrhwfdo.supabase.co
      ORACLE: https://miu-oracle-ask.franchescopalacios9.workers.dev/ask
      RELAY: https://miu-ai-relay-v215-miu4.vercel.app/api/ask
    steps:
      - name: 1 - Verificar oraculo vivo (contrato pregunta)
        id: oracle
        run: |
          R=$(curl -s --max-time 15 "$ORACLE?pregunta=estado" 2>/dev/null || echo '{}')
          VIA=$(echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('proveedor','muerto'))" 2>/dev/null || echo 'muerto')
          echo "oracle via=$VIA"
          echo "VIA=$VIA" >> $GITHUB_ENV

      - name: 2 - Propagar endpoints a TODOS los sustratos
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD='[{"clave":"oracle_relay_url","valor":"'"$ORACLE"'"},{"clave":"oracle_ask_url","valor":"'"$ORACLE"'"},{"clave":"llm_relay_v215_url","valor":"'"$RELAY"'"},{"clave":"oracle_via","valor":"'"$VIA"'"},{"clave":"guardian_flujo_ts","valor":"'"$TS"'"}]'
          # Panteon (fatal si falla: es el sustrato canonico)
          curl -sf -X POST "$PANT/rest/v1/relay_config?on_conflict=clave" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            -d "$PAYLOAD" && echo 'panteon OK'
          # Coord (no-fatal)
          curl -sf --max-time 8 -X POST "$COORD/rest/v1/relay_config?on_conflict=clave" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            -d "$PAYLOAD" 2>/dev/null && echo 'coord OK' || echo 'coord no responde'
          # Cipher (no-fatal)
          curl -sf --max-time 8 -X POST "$CIPHER/rest/v1/relay_config?on_conflict=clave" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            -d "$PAYLOAD" 2>/dev/null && echo 'cipher OK' || echo 'cipher no responde'

      - name: 4 - Gossip del guardian
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # FIX 2026-11-13: curl -sf sin fallback mataba el job cuando panteon daba 4xx intermitente (exit 22).
          # Reintentos + degradacion elegante: el guardian reporta, no muere.
          CICLO=$(curl -sf --retry 3 --retry-delay 5 --max-time 20 "$PANT/rest/v1/relay_config?clave=eq.ciclo_real&select=valor" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["valor"] if d else "?")' 2>/dev/null || echo '?')
          curl -sf --retry 3 --retry-delay 5 --max-time 20 -X POST "$PANT/rest/v1/gossip_log" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d '[{"tipo":"guardian_flujo","origen":"github-cron-hourly","destino":"panteon","k_i_estado":"no_evaluado","payload":"oracle via='"$VIA"' ciclo='"$CICLO"' oracle+relay_v215 propagados a panteon+coord+cipher","ts":"'"$TS"'"}]' \
            && echo 'gossip OK' || echo 'gossip_log fallido (no fatal)'
