name: miu-cablear-oracle-v28
# Cablea el oráculo vivo al ecosistema (v34 CF desde 2026-11-12):
# Los Vercel oracle-ask-v26/v27/v28 y buscar-corpus-miu4 estan MUERTOS (404
# DEPLOYMENT_NOT_FOUND). Oraculos vivos verificados:
#   1. https://miu-oracle-ask.franchescopalacios9.workers.dev (v34-openrouter)
#   2. https://fran-oraculo-miu.jaimepvicente.workers.dev/miu/global (V-infinity-27)
#   3. https://miu-ai-relay-v215-miu4.vercel.app/api/ask (relay groq)
# 1. Verifica salud con test real (cascada: v34 > relay-v215)
# 2. Actualiza relay_config: canonicos a vivos, muertos marcados
# 3. Escribe tareas al jardinero via miu_tareas
# 4. Registra capacidades en gossip (el trigger del Panteon inyecta flow_id)
on:
  push:
    paths: [.github/workflows/miu-cablear-oracle-v28.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
jobs:
  cablear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PANT: https://tpfiybpguuxskitszhmk.supabase.co
      PANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
      ORACLE_CF: https://miu-oracle-ask.franchescopalacios9.workers.dev
      ORACLE_FIN: https://fran-oraculo-miu.jaimepvicente.workers.dev/miu/global
      RELAY_V215: https://miu-ai-relay-v215-miu4.vercel.app/api/ask
    steps:
      - name: 1 - Salud de oraculos (cascada)
        run: |
          H1=$(curl -sf --max-time 10 "$ORACLE_CF/health" 2>/dev/null || echo '')
          H3=$(curl -sf --max-time 10 "$RELAY_V215" 2>/dev/null || echo '')
          echo "v34 CF:  ${H1:0:120}"
          echo "relay215: ${H3:0:120}"
          # v34 es el principal; si ambos muertos, fallar ruidoso
          if [ -z "$H1" ] && [ -z "$H3" ]; then echo "ERROR: todos los oraculos muertos"; exit 1; fi
          if [ -n "$H1" ]; then echo "PRIMARY=cf" >> $GITHUB_ENV; else echo "PRIMARY=relay" >> $GITHUB_ENV; fi

      - name: 2 - Test real (pregunta viva, latencia LLM variable 1-60s+)
        run: |
          # openrouter free tier: latencia muy variable, reintentar hasta 3x con 90s
          R=''
          for i in 1 2 3; do
            if [ "$PRIMARY" = "cf" ]; then
              R=$(curl -sf --max-time 90 -X POST "$ORACLE_CF/ask" -H 'Content-Type: application/json' -d '{"pregunta":"rho x mayor que cero en 8 palabras"}' 2>/dev/null || echo '')
            else
              R=$(curl -sf --max-time 90 -X POST "$RELAY_V215" -H 'Content-Type: application/json' -d '{"message":"rho x mayor que cero en 8 palabras"}' 2>/dev/null || echo '')
            fi
            [ -n "$R" ] && break
            echo "intento $i vacio, reintentando..."
            sleep 5
          done
          echo "test: ${R:0:200}"
          OK=$(echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print('si' if (d.get('respuesta') or d.get('text') or d.get('ok')) else 'no')" 2>/dev/null || echo no)
          echo "Respuesta util: $OK"
          [ "$OK" = "si" ] || { echo "ERROR: oraculo no responde util"; exit 1; }
          echo "VIA=$PRIMARY" >> $GITHUB_ENV

      - name: 3 - Actualizar relay_config (vivos arriba, muertos marcados)
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X POST "$PANT/rest/v1/relay_config?on_conflict=clave" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            -d "[
              {\"clave\":\"oracle_ask_url\",\"valor\":\"$ORACLE_CF/ask\"},
              {\"clave\":\"oracle_ask_url_override\",\"valor\":\"$ORACLE_CF/ask\"},
              {\"clave\":\"oracle_relay_url\",\"valor\":\"$ORACLE_CF/ask\"},
              {\"clave\":\"oracle_relay_via\",\"valor\":\"cf-worker-v34-openrouter ($VIA) verificado $TS\"},
              {\"clave\":\"oracle_ask_v28_url\",\"valor\":\"MUERTO_404: oracle-ask-v28-miu4.vercel.app (deployment no existe)\"},
              {\"clave\":\"oracle_ask_v27_url\",\"valor\":\"MUERTO_404: oracle-ask-v27-miu4.vercel.app (deployment no existe)\"},
              {\"clave\":\"oracle_ask_v26_url\",\"valor\":\"MUERTO_404: oracle-ask-v26-miu4.vercel.app (deployment no existe)\"},
              {\"clave\":\"oracle_ask_v24_url\",\"valor\":\"MUERTO: fepyzxwyneervidlybvi.supabase.co/functions/v1/oracle-ask-v24 (edge function caida)\"},
              {\"clave\":\"oracle_orquestador_url\",\"valor\":\"$ORACLE_FIN\"},
              {\"clave\":\"oracle_fallback_url\",\"valor\":\"$ORACLE_FIN\"},
              {\"clave\":\"buscar_corpus_url\",\"valor\":\"MUERTO_404: buscar-corpus-miu4.vercel.app — pendiente redeploy o deprecacion\"},
              {\"clave\":\"oracle_audit_ts\",\"valor\":\"$TS\"}
            ]" && echo 'relay_config actualizado'


      - name: 4 - Gossip presencia en red (el Panteon exige gossip <1h antes de tareas criticas)
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X POST "$PANT/rest/v1/gossip_log" \
            -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d "[{\"tipo\":\"oracle_cableado\",\"origen\":\"github-action-cablear\",\"destino\":\"enjambre\",\"payload\":{\"oracle\":\"cf-v34\",\"via\":\"$VIA\",\"muertos\":[\"v26\",\"v27\",\"v28\",\"v24\",\"buscar-corpus\"],\"ts\":\"$TS\"}}]"
          echo '=== ORACULO CABLEADO ==='
          echo "principal: $ORACLE_CF/ask (via $VIA)"
          echo "orquestador: $ORACLE_FIN"
          echo "fallback:   $RELAY_V215"
      - name: 5 - Tareas al jardinero (miu_tareas, tolerante a duplicados)
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # fila por fila: el Panteon rechaza duplicados <2h (P0002) y exige
          # presencia en red <1h (P0001, ya gossepeamos en paso 4) — un rechazo
          # no debe tumbar el run completo
          post() {
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$PANT/rest/v1/miu_tareas" \
              -H "apikey: $PANON" -H "Authorization: Bearer $PANON" \
              -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d "[$1]")
            if [ "$CODE" = "201" ]; then echo "ok: $(echo $1 | head -c 60)"; else echo "aviso ($CODE): $(head -c 160 /tmp/resp.json)"; fi
          }
          post "{\"tipo\":\"redeploy_buscar_corpus\",\"prioridad\":5,\"origen\":\"github-action-cablear\",\"payload\":{\"flow_id\":\"cablear-$TS\",\"tarea\":\"Redeployar buscar-corpus-miu4 en Vercel (404 DEPLOYMENT_NOT_FOUND): el flujo corpus-cache del oracle dependia de el. Si no se puede, deprecar y purgar referencias\"},\"ts\":\"$TS\"}"
          post "{\"tipo\":\"verificar_consumers_oracle\",\"prioridad\":2,\"origen\":\"github-action-cablear\",\"payload\":{\"flow_id\":\"cablear-$TS\",\"tarea\":\"Verificar consumers de oracle_ask_url_override: apuntaba al v24 muerto (edge fepyzx caido), ahora apunta al CF v34. Confirmar que los 36 crons que llaman oracle usen oracle_ask_url\"},\"ts\":\"$TS\"}"
          post "{\"tipo\":\"auditar_workflows_oracle\",\"prioridad\":5,\"origen\":\"github-action-cablear\",\"payload\":{\"flow_id\":\"cablear-$TS\",\"tarea\":\"Workflows que llamaban oracle-ask-v27/v28 vercel ya parcheados a cascada CF v34 + relay v215 (miu-fix-groq-alias). Verificar proxima corrida 05:32Z\"},\"ts\":\"$TS\"}"

