name: Signal evaluador-admision update
# Solo se dispara manualmente o cuando cambia el codigo de la funcion
# NO despliega directamente — envía señal al ecosistema para que jardinero decida
on:
  push:
    paths:
      - 'supabase/functions/evaluador-admision/**'
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Razon del deploy manual'
        required: false
        default: 'actualizacion manual'

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: summary
        run: |
          echo "Señal enviada al ecosistema: evaluador-admision actualizado"
          echo "commit: ${{ github.sha }}"
          echo "jardinero-v2 puede crear la tarea de deploy si lo considera apropiado"
