name: miu-autocura
# Autocura v1 (CHK-195): la reaccion en cadena del 12/13-nov duro horas sin auto-repararse.
# Este guardian repara sin humano: suelos, token HF y workflows transitorios.
on:
  schedule:
    - cron: '17 * * * *'  # offset para no chocar con los crons existentes
  workflow_dispatch:
permissions:
  contents: read
  actions: write  # re-disparar workflows fallidos
jobs:
  autocura:
    runs-on: ubuntu-latest
    env:
      PANT: https://tpfiybpguuxskitszhmk.supabase.co
      PANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
      REPO: Jaime393/miu-ecosistema
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 1 - Salud de suelos
        run: |
          set +e
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          panta() { curl -s --retry 2 --retry-delay 3 --max-time 15 "$PANT/rest/v1/relay_config?clave=eq.$1&select=valor" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['valor'] if d else '')" 2>/dev/null; }
          sembrar() { curl -s --retry 2 --retry-delay 3 --max-time 15 -X POST "$PANT/rest/v1/relay_config?on_conflict=clave" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "[{\"clave\":\"$1\",\"valor\":\"$2\"}]" >/dev/null; }
          # suelos a vigilar: panteon (local) + federados con su anon key
          ESTADOS=""
          for REF in fepyzxwyneervidlybvi qtmcbqsahdomgsxgsaxi fxmupxpwzzxnjcscpyuw fzdyxgkmpazbrfrhwfdo atsdrjmrgmpdpbxfwgxe; do
            ANON=$(panta "supa_ext_${REF}_anon")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "https://$REF.supabase.co/rest/v1/" -H "apikey: $ANON" 2>/dev/null)
            # 401 = vivo pidiendo auth; 200 = vivo; 000 = muerto
            [ "$CODE" = "000" ] && ESTADO="caido" || ESTADO="vivo"
            # valor plano (json anidado rompia el POST)
            sembrar "suelo_${REF}_estado" "$ESTADO|$CODE|$TS"
            ESTADOS="$ESTADOS $REF=$ESTADO"
            echo "suelo $REF: $CODE -> $ESTADO"
          done
          echo "SUELOS:$ESTADOS"

      - name: 2 - Token HF vivo (rotacion automatica del pool)
        run: |
          set +e
          panta() { curl -s --retry 2 --retry-delay 3 --max-time 15 "$PANT/rest/v1/relay_config?clave=eq.$1&select=valor" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['valor'] if d else '')" 2>/dev/null; }
          sembrar() { curl -s --retry 2 --retry-delay 3 --max-time 15 -X POST "$PANT/rest/v1/relay_config?on_conflict=clave" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "[{\"clave\":\"$1\",\"valor\":\"$2\"}]" >/dev/null; }
          ACT=$(panta hf_token_activo)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "https://huggingface.co/api/whoami-v2" -H "Authorization: Bearer $ACT")
          echo "hf_token_activo: HTTP $CODE"
          if [ "$CODE" = "401" ]; then
            echo "token muerto -> rotando desde el pool"
            for K in hf_token hf_token_nuevo hf_token_3 hf_token_write hf_token_push; do
              CAND=$(panta $K); [ -z "$CAND" ] && continue
              C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "https://huggingface.co/api/whoami-v2" -H "Authorization: Bearer $CAND")
              echo "candidato $K: HTTP $C"
              if [ "$C" = "200" ]; then
                sembrar hf_token_activo "$CAND"
                echo "ROTADO: hf_token_activo <- $K"
                curl -s --retry 2 --max-time 15 -X POST "$PANT/rest/v1/gossip_log" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d "[{\"tipo\":\"autocura_hf_rotado\",\"origen\":\"miu-autocura\",\"destino\":\"panteon\",\"k_i_estado\":\"no_evaluado\",\"payload\":\"hf_token_activo murio (401), rotado desde $K\",\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]" >/dev/null
                break
              fi
            done
          fi

      - name: 3 - Redisparo de workflows con fallo transitorio
        run: |
          set +e
          # Solo redispara si el fallo es TRANSITORIO: ultimo run fallido pero alguno de los 3 previos exitoso.
          # Si los ultimos 3 fallaron, no buclea: solo alerta (grieta persistente = humano).
          DESDE=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%MZ)
          gh run list -R "$REPO" --status failure --created ">$DESDE" --limit 20 --json workflowName,databaseId,conclusion,createdAt --jq '.[] | .workflowName' 2>/dev/null | sort -u | grep -v '^miu-autocura$' | while read WF; do
            [ -z "$WF" ] && continue
            echo "evaluando: $WF"
            ULT3=$(gh run list -R "$REPO" --workflow "$WF" --limit 3 --json conclusion --jq '[.[].conclusion] | join(",")' 2>/dev/null)
            echo "  ultimos 3: $ULT3"
            case "$ULT3" in
              success,*|*,success,*|*,success)
                echo "  fallo transitorio -> redisparando"
                if gh workflow run "$WF" -R "$REPO" 2>/dev/null; then
                  curl -s --retry 2 --max-time 15 -X POST "$PANT/rest/v1/gossip_log" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d "[{\"tipo\":\"autocura_redisparo\",\"origen\":\"miu-autocura\",\"destino\":\"github\",\"k_i_estado\":\"no_evaluado\",\"payload\":\"redisparo $WF (fallo transitorio: $ULT3)\",\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]" >/dev/null
                  echo "  redisparo OK"
                else
                  echo "  redisparo fallo (sin workflow_dispatch?)"
                fi
                ;;
              *)
                echo "  fallo persistente -> solo alerta, no redisparo"
                ;;
            esac
          done

      - name: 4 - Gossip resumen
        run: |
          set +e
          SUELOS=$(curl -s --retry 2 --max-time 15 "$PANT/rest/v1/relay_config?clave=like.suelo_*_estado&select=clave,valor&limit=15" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(r['clave'].replace('suelo_','').replace('_estado','')+':'+('vivo' if 'vivo' in str(r['valor']) else 'caido') for r in d))" 2>/dev/null || echo 'n/d')
          curl -s --retry 2 --max-time 15 -X POST "$PANT/rest/v1/gossip_log" -H "apikey: $PANON" -H "Authorization: Bearer $PANON" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d "[{\"tipo\":\"autocura_ciclo\",\"origen\":\"miu-autocura\",\"destino\":\"panteon\",\"k_i_estado\":\"no_evaluado\",\"payload\":\"autocura v1 ejecutada. suelos: $SUELOS\",\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]" >/dev/null && echo "gossip OK" || echo "gossip fallido (no fatal)"
