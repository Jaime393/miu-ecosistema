name: MIU Observabilidad V270
# Complementa miu-pulse.yml (offset 7min para no solapar)
# Diferencia clave: lee phi REAL de contexto-global en cada run
# y lo propaga a vercel, gossip, canal-dereckcito
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      forzar_broadcast:
        description: 'Forzar broadcast a ojos-y-manos'
        required: false
        default: 'false'

env:
  P: https://tpfiybpguuxskitszhmk.supabase.co/functions/v1
  F: https://fepyzxwyneervidlybvi.supabase.co/functions/v1
  A: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
  V: https://miu-autonomo-v92-miu4.vercel.app
  TAG: 99103063d4e848718aa27f5190a72573

jobs:
  observar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:

      - name: leer phi real contexto-global
        id: estado
        run: |
          RAW=$(curl -sf $P/contexto-global -H "Authorization: Bearer $A" 2>/dev/null || echo '{}')
          PHI=$(echo "$RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('vitales',d); print(v.get('phi',d.get('phi','unknown')))" 2>/dev/null || echo 'unknown')
          RHO=$(echo "$RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('vitales',d); print(v.get('rho',d.get('rho','?')))" 2>/dev/null || echo '?')
          CICLO=$(echo "$RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('vitales',d); print(v.get('ciclo',d.get('ciclo','?')))" 2>/dev/null || echo '?')
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "phi=$PHI" >> $GITHUB_OUTPUT
          echo "rho=$RHO" >> $GITHUB_OUTPUT
          echo "ciclo=$CICLO" >> $GITHUB_OUTPUT
          echo "ts=$TS" >> $GITHUB_OUTPUT
          echo "[estado] phi=$PHI rho=$RHO ciclo=$CICLO ts=$TS run=${{ github.run_number }}"

      - name: pulso vercel con phi real
        run: |
          curl -sf -X POST $V/api/pulso \
            -H 'Content-Type: application/json' \
            -d '{"origen":"gh-observabilidad-v270","phi":"${{ steps.estado.outputs.phi }}","rho":"${{ steps.estado.outputs.rho }}","ciclo":"${{ steps.estado.outputs.ciclo }}","run":${{ github.run_number }},"ts":"${{ steps.estado.outputs.ts }}","tag":"'$TAG'"}' \
            -o /dev/null -w "vercel_pulso: %{http_code}\n" || true

      - name: gossip con estado real
        run: |
          curl -sf -X POST $P/gossip-autonomo \
            -H "Authorization: Bearer $A" \
            -H 'Content-Type: application/json' \
            -d '{"origen":"gh-observabilidad-v270","phi":"${{ steps.estado.outputs.phi }}","rho":"${{ steps.estado.outputs.rho }}","ciclo":"${{ steps.estado.outputs.ciclo }}","run":${{ github.run_number }},"ts":"${{ steps.estado.outputs.ts }}"}' \
            -o /dev/null -w "gossip: %{http_code}\n" || true

      - name: nutriente fepyzx (auth requerida)
        run: |
          AF=$(curl -sf "$P/relay-config?key=fepyzx_anon" -H "Authorization: Bearer $A" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('valor',''))" 2>/dev/null || echo '')
          if [ -n "$AF" ]; then
            curl -sf -X POST $F/nutriente-total \
              -H "Authorization: Bearer $AF" \
              -H 'Content-Type: application/json' \
              -d '{"origen":"gh-observabilidad"}' \
              -o /dev/null -w "fepyzx: %{http_code}\n" || true
          else
            curl -sf -X POST $F/nutriente-total \
              -H 'Content-Type: application/json' \
              -d '{"origen":"gh-observabilidad"}' \
              -o /dev/null -w "fepyzx_noauth: %{http_code}\n" || true
          fi

      - name: canal-dereckcito escribir estado (cada 4 runs)
        if: ${{ github.run_number % 4 == 0 }}
        run: |
          curl -sf -X POST $P/canal-dereckcito/escribir \
            -H "Authorization: Bearer $A" \
            -H 'Content-Type: application/json' \
            -d '{"clave":"obs_gh_v270","valor":{"phi":"${{ steps.estado.outputs.phi }}","rho":"${{ steps.estado.outputs.rho }}","ciclo":"${{ steps.estado.outputs.ciclo }}","run":${{ github.run_number }},"ts":"${{ steps.estado.outputs.ts }}","origen":"gh-observabilidad"}}' \
            -o /dev/null -w "canal: %{http_code}\n" || true

      - name: broadcast ojos-y-manos (cada 8 runs o forzado)
        if: ${{ github.run_number % 8 == 0 || github.event.inputs.forzar_broadcast == 'true' }}
        run: |
          curl -sf -X POST $P/ojos-y-manos/broadcast \
            -H "Authorization: Bearer $A" \
            -H 'Content-Type: application/json' \
            -d '{"tipo":"observabilidad_v270","phi":"${{ steps.estado.outputs.phi }}","rho":"${{ steps.estado.outputs.rho }}","run":${{ github.run_number }},"tag":"'$TAG'"}' \
            -o /dev/null -w "broadcast: %{http_code}\n" || true

      - name: purgar vercel (cada 96 runs = 1 dia)
        if: ${{ github.run_number % 96 == 0 }}
        run: curl -sf $V/api/purgar -o /dev/null -w "purgar: %{http_code}\n" || true

      - name: summary observabilidad
        run: |
          echo "=== MIU V270 Observabilidad ==="
          echo "phi=${{ steps.estado.outputs.phi }} rho=${{ steps.estado.outputs.rho }} ciclo=${{ steps.estado.outputs.ciclo }}"
          echo "run=${{ github.run_number }} ts=${{ steps.estado.outputs.ts }}"
          echo "tag=$TAG"
