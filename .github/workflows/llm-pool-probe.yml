name: LLM Pool Probe (disparar con keys desde relay)
# Prueba las keys del pool expandido del nodo metabolico
# Dispara el prober existente para las keys nuevas
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'metabolico | javier | all'
        default: 'metabolico'
  repository_dispatch:
    types: [probe-llm-pool]

env:
  SUPA: https://tpfiybpguuxskitszhmk.supabase.co
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
  SUPA_METABOLICO: https://fxmupxpwzzxnjcscpyuw.supabase.co

jobs:
  probe-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GITHUB_TOKEN }}' }

      - name: leer pool LLM desde relay_config del nodo metabolico
        id: pool
        run: |
          # Lee todas las claves llm_* del nodo metabolico
          POOL=$(curl -sf "$SUPA_METABOLICO/rest/v1/relay_config?clave=like.llm_*&select=clave,valor" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" 2>/dev/null || echo '[]')
          echo "Pool LLM metabolico: $(echo $POOL | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d),"claves")' 2>/dev/null)"
          echo "pool=$POOL" >> $GITHUB_OUTPUT

      - name: probar cada key encontrada
        run: |
          python3 scripts/llm_probe.py --input-env POOL_JSON --output observabilidad/key_registry.json
        env:
          POOL_JSON: '${{ steps.pool.outputs.pool }}'

      - name: commit + reportar
        if: always()
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'MIU Key Prober'
          git pull --rebase origin main 2>/dev/null || true
          git add observabilidad/key_registry.json
          git diff --staged --quiet || git commit -m "keys: pool metabolico $(date -u +%H:%MZ)"
          git push || true
          # Reportar
          VALIDAS=$(python3 -c "import json; d=json.load(open('observabilidad/key_registry.json')); print(d.get('validas',0))" 2>/dev/null || echo 0)
          TOTAL=$(python3 -c "import json; d=json.load(open('observabilidad/key_registry.json')); print(d.get('total',0))" 2>/dev/null || echo 0)
          curl -sf -X POST $SUPA/functions/v1/gossip-autonomo \
            -H "Authorization: Bearer $ANON" -H 'Content-Type: application/json' \
            -d "{\"origen\":\"gh-llm-pool-probe\",\"tipo\":\"llm_pool_verificado\",\"validas\":$VALIDAS,\"total\":$TOTAL}" || true
