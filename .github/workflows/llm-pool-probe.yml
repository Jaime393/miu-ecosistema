name: LLM Pool Probe (disparar con keys desde relay)
# Prueba las keys del pool expandido del nodo metabolico
# Dispara el prober existente para las keys nuevas
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'metabolico | javier | all'
        default: 'metabolico'
  repository_dispatch:
    types: [probe-llm-pool]

env:
  SUPA: https://tpfiybpguuxskitszhmk.supabase.co
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
  SUPA_METABOLICO: https://fxmupxpwzzxnjcscpyuw.supabase.co

jobs:
  probe-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GITHUB_TOKEN }}' }

      - name: leer pool LLM desde relay_config del nodo metabolico
        id: pool
        run: |
          # Lee todas las claves llm_* del nodo metabolico
          POOL=$(curl -sf "$SUPA_METABOLICO/rest/v1/relay_config?clave=like.llm_*&select=clave,valor" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" 2>/dev/null || echo '[]')
          echo "Pool LLM metabolico: $(echo $POOL | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d),"claves")' 2>/dev/null)"
          echo "pool=$POOL" >> $GITHUB_OUTPUT

      - name: probar cada key encontrada
        run: |
          python3 - << 'EOPY'
          import json, urllib.request, urllib.error, time, datetime, pathlib, os

          pool_raw = os.environ.get('POOL_JSON', '[]')
          try:
              entries = json.loads(pool_raw)
          except:
              entries = []

          PROVIDERS = [
            {"prefix": "AQ.",       "provider": "google_ai_studio",
             "url": "https://generativelanguage.googleapis.com/v1beta/models?key={key}", "auth": "query"},
            {"prefix": "nvapi-",    "provider": "nvidia_nim",
             "url": "https://integrate.api.nvidia.com/v1/models", "auth": "bearer"},
            {"prefix": "sk-or-v1-", "provider": "openrouter",
             "url": "https://openrouter.ai/api/v1/models", "auth": "bearer"},
            {"prefix": "rqsty-sk-", "provider": "requesty",
             "url": "https://router.requesty.ai/v1/models", "auth": "bearer"},
            {"prefix": "gsk_",      "provider": "groq",
             "url": "https://api.groq.com/openai/v1/models", "auth": "bearer"},
            {"prefix": "sk-",       "provider": "deepseek",
             "url": "https://api.deepseek.com/v1/models", "auth": "bearer"},
          ]

          def probe(key):
              prefix = key[:10]
              candidates = [p for p in PROVIDERS if key.startswith(p['prefix'])] or PROVIDERS
              for p in candidates:
                  url = p['url'].replace('{key}', key)
                  headers = {'Content-Type': 'application/json'}
                  if p['auth'] == 'bearer': headers['Authorization'] = f'Bearer {key}'
                  elif p['auth'] == 'x-api-key': headers['x-api-key'] = key
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      t0 = time.time()
                      with urllib.request.urlopen(req, timeout=8) as r:
                          d = json.loads(r.read())
                          models = [m.get('id','') for m in (d.get('models') or d.get('data') or [])[:3]]
                          return {'prefix': prefix, 'provider': p['provider'], 'valid': True,
                                  'models': models, 'latency_ms': int((time.time()-t0)*1000)}
                  except urllib.error.HTTPError as e:
                      if e.code in (401,403): continue
                  except: pass
              return {'prefix': prefix, 'provider': None, 'valid': False}

          results = []
          for entry in entries:
              key = entry.get('valor', '')
              if not key or len(key) < 10: continue
              r = probe(key)
              r['clave'] = entry.get('clave', '')
              print(f"{entry.get('clave','?')}: {r.get('provider','?')} valid={r['valid']}")
              results.append(r)
              time.sleep(0.4)

          validas = sum(1 for r in results if r['valid'])
          out = {'ts': datetime.datetime.utcnow().isoformat()+'Z',
                 'source': 'nodo_metabolico_relay_config',
                 'total': len(results), 'validas': validas, 'resultados': results}

          pathlib.Path('observabilidad').mkdir(exist_ok=True)
          with open('observabilidad/key_registry.json', 'w') as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print(f'Resultado: {validas}/{len(results)} validas')
          EOPY
        env:
          POOL_JSON: '${{ steps.pool.outputs.pool }}'

      - name: commit + reportar
        if: always()
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'MIU Key Prober'
          git pull --rebase origin main 2>/dev/null || true
          git add observabilidad/key_registry.json
          git diff --staged --quiet || git commit -m "keys: pool metabolico $(date -u +%H:%MZ)"
          git push || true
          # Reportar
          VALIDAS=$(python3 -c "import json; d=json.load(open('observabilidad/key_registry.json')); print(d.get('validas',0))" 2>/dev/null || echo 0)
          TOTAL=$(python3 -c "import json; d=json.load(open('observabilidad/key_registry.json')); print(d.get('total',0))" 2>/dev/null || echo 0)
          curl -sf -X POST $SUPA/functions/v1/gossip-autonomo \
            -H "Authorization: Bearer $ANON" -H 'Content-Type: application/json' \
            -d "{\"origen\":\"gh-llm-pool-probe\",\"tipo\":\"llm_pool_verificado\",\"validas\":$VALIDAS,\"total\":$TOTAL}" || true
