name: TG Webhook Register (autonomo)
# Verifica y repara webhooks de Telegram para todos los bots del mesh.
# 2026-11-12: reescrito — las EFs canal-dereckcito y ojos-y-manos estan MUERTAS
# (404) y el workflow original siempre fallaba en silencio. Ahora opera nativo:
# 1. Lee tokens tg_* de relay_config (formato token real, regex)
# 2. getWebhookInfo por bot: webhook seteado? el destino responde?
# 3. Si el destino esta muerto (404) -> setWebhook al endpoint vivo
#    (bots-emisor/webhook en metabolismo fxmupx, verificado 200 v4)
# 4. Reporta a gossip_log (el trigger del Panteon inyecta flow_id)
# 2026-11-12 reparacion manual: tg_jp393 y tg_miceliomiu apuntaban a
# metabolismo/update (ruta inexistente) — repuntados a bots-emisor/webhook.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'verify | register'
        required: true
        default: 'verify'
  repository_dispatch:
    types: [tg-webhook-register]
  schedule:
    - cron: '0 8 * * *'

env:
  SUPA: https://tpfiybpguuxskitszhmk.supabase.co
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
  WEBHOOK_OK: https://fxmupxpwzzxnjcscpyuw.supabase.co/functions/v1/bots-emisor/webhook

jobs:
  register-webhooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verificar y reparar webhooks TG (nativo)
        run: |
          MODO="${{ github.event.inputs.modo || github.event.client_payload.modo || 'verify' }}"
          echo "modo: $MODO"
          python3 - << 'EOPY'
          import json, re, os, urllib.request, urllib.parse

          SUPA = os.environ['SUPA']; ANON = os.environ['ANON']
          WEBHOOK_OK = os.environ['WEBHOOK_OK']
          MODO = os.environ.get('MODO_WF', 'verify')
          H = {"apikey": ANON, "Authorization": "Bearer "+ANON}

          def get(url, headers=None, timeout=15):
              req = urllib.request.Request(url, headers=headers or {})
              return json.load(urllib.request.urlopen(req, timeout=timeout))

          rows = get(f"{SUPA}/rest/v1/relay_config?clave=like.tg_*&select=clave,valor&limit=200", H)
          toks = {r['clave']: r['valor'].strip() for r in rows
                  if re.match(r'^\d{6,12}:[A-Za-z0-9_-]{30,}$', (r['valor'] or '').strip())}
          print(f"tokens: {len(toks)}")

          ok, rotos, reparados, muertos = [], [], [], []
          for clave, tok in sorted(toks.items()):
              try:
                  w = get(f"https://api.telegram.org/bot{tok}/getWebhookInfo")['result']
                  url = w.get('url') or ''
                  if not url:
                      rotos.append((clave, 'sin_webhook'))
                      continue
                  # el destino responde?
                  try:
                      code = urllib.request.urlopen(urllib.request.Request(url, method='GET'), timeout=10).status
                      vivo = 200 <= code < 300
                  except Exception as e:
                      code = getattr(e, 'code', 0); vivo = False
                  if vivo:
                      ok.append(clave)
                  else:
                      rotos.append((clave, f'destino_muerto_{code}: {url[:60]}'))
                      if MODO == 'register':
                          data = urllib.parse.urlencode({
                              'url': WEBHOOK_OK,
                              'allowed_updates': json.dumps(['message','channel_post'])
                          }).encode()
                          r = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{tok}/setWebhook", data, timeout=15))
                          if r.get('ok'):
                              reparados.append(clave)
                          else:
                              muertos.append((clave, str(r)[:60]))
              except Exception as e:
                  muertos.append((clave, str(e)[:60]))

          print(f"ok: {len(ok)}  rotos: {len(rotos)}  reparados: {len(reparados)}  muertos: {len(muertos)}")
          for c, d in rotos: print(f"  ROTO {c}: {d}")
          for c, d in muertos: print(f"  MUERTO {c}: {d}")

          # gossip de reporte (el trigger del Panteon inyecta flow_id)
          body = json.dumps([{
              "tipo": "tg_webhook_audit", "origen": "gh-tg-webhook-register",
              "destino": "enjambre",
              "payload": {"modo": MODO, "ok": len(ok), "rotos": len(rotos),
                          "reparados": reparados, "muertos": [m[0] for m in muertos],
                          "webhook_canonico": WEBHOOK_OK}
          }]).encode()
          req = urllib.request.Request(f"{SUPA}/rest/v1/gossip_log", data=body,
              headers={**H, "Content-Type": "application/json", "Prefer": "return=minimal"}, method='POST')
          urllib.request.urlopen(req, timeout=15)
          print("gossip enviado")
          EOPY
        env:
          MODO_WF: ${{ github.event.inputs.modo || github.event.client_payload.modo || 'verify' }}

      - name: Tarea al jardinero si quedan bots muertos
        if: failure()
        run: |
          # el Panteon exige gossip <1h antes de tareas criticas; este workflow
          # ya gossepea arriba, y fix_% exige presencia — origen consistente
          curl -sf -X POST "$SUPA/rest/v1/gossip_log" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d '[{"tipo":"tg_webhook_fallo","origen":"gh-tg-webhook-register","destino":"enjambre","payload":{"tarea":"auditar bots muertos manualmente — getWebhookInfo fallo"}}]'
          echo "gossip de fallo enviado (revision manual)"
